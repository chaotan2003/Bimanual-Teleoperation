[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bimanual_teleop"
version = "2.0.0"
description = "XR teleoperation of a dual-arm JAKA K1 with SWGR, AEAC and J-PARSE IK"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Zhigen", email = "zhaozhigen@gmail.com"}
]
dependencies = [
    "numpy",
    "meshcat",
    "pyroki @ git+https://github.com/chungmin99/pyroki.git",
    "tyro",
    "viser",
    "yourdfpy",
]

[project.optional-dependencies]
dev = [
    "black",
]

[tool.setuptools.packages.find]
include = ["bimanual_teleop*"]

[tool.setuptools.package-data]
bimanual_teleop = ["../assets/**/*"]

[tool.black]
line-length = 120
